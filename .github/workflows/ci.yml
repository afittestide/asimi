name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - '**'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
      - name: Start the podman socket
        run: |
          # `apt install podman` ships the client only; the integration tests
          # dial a podman service socket, so one must be running. The runner
          # user is non-root, and a root-owned /var/run/podman/podman.sock
          # answers "permission denied" (the red main this fixes), so start a
          # ROOTLESS service whose socket the user owns.
          #
          # The socket lives at a NON-default path on purpose: the client's
          # platform probe would otherwise find a stray socket even when the
          # lane is broken. Keeping it off the default path means CONTAINER_HOST
          # alone decides whether the tests run — establishConnection honors it.
          #
          # This step must never fail the build: an unusable podman lane must
          # degrade to a loud skip in the test step, not a red job. Every
          # fallible command is guarded, and errexit is turned off explicitly.
          set +e
          socket_dir="${RUNNER_TEMP:-/tmp}/podman"
          mkdir -p "$socket_dir"
          CONTAINER_HOST="unix://$socket_dir/podman.sock"
          export CONTAINER_HOST
          # nohup + disown so the service outlives this step's shell; without it
          # the socket would vanish before the test step dials it.
          nohup podman system service --time=0 "$CONTAINER_HOST" >/tmp/podman-service.log 2>&1 &
          disown 2>/dev/null
          for _ in $(seq 1 30); do
            if podman info >/dev/null 2>&1; then break; fi
            sleep 1
          done
          # A pingable service is not a usable lane: rootless podman can answer
          # `info` and still fail to run a container (no user namespaces). Prove
          # the lane end to end with the very image the integration tests use;
          # only then export CONTAINER_HOST. A half-working lane must degrade to
          # a loud skip, not five hard failures.
          if podman run --rm docker.io/library/golang:1.26.10-bookworm true >/tmp/podman-smoke.log 2>&1; then
            echo "CONTAINER_HOST=$CONTAINER_HOST" >> "$GITHUB_ENV"
            echo "podman lane is up; integration tests will run"
          else
            echo "::warning::podman lane is not usable; integration tests will skip"
            cat /tmp/podman-service.log /tmp/podman-smoke.log 2>/dev/null || true
          fi
          exit 0
      - name: Run linting
        run: just lint
      - name: Run tests
        run: just test
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heaven-tests
          path: heaven/tests/
          if-no-files-found: warn

  goreleaser:
    name: Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: tag_name
        run: |
          echo "current_version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Get Changelog Entry
        id: changelog_reader
        uses: mindsers/changelog-reader-action@v2
        with:
          validation_level: warn
          version: ${{ steps.tag_name.outputs.current_version }}
          path: ./CHANGELOG.md

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Write release notes
        run: |
          cat << 'EOF' > /tmp/release-notes.md
          ${{ steps.changelog_reader.outputs.changes }}
          EOF

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --release-notes /tmp/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
