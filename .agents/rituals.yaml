- name: hello-world
  steps:
    - name: testing
      out: Hello world

- name: print-edict
  description: print the edict details
  inputs:
    edict_id:
      type: string
      required: true
  background:
    - the edict details
  steps:
    - name: print
      out: b4 {{ .edict }} after

- name: release-version
  description: |
    Prepares and executes a version release following the documented release
    process. Updates CHANGELOG, version constant, roadmap, commits, tags,
    and pushes with explicit Ruler confirmation.
  inputs:
    version:
      type: string
      required: true
  background:
    - the earth status
  max_retries: 2
  steps:
    - name: verify-worktree
      minister: judge
      given:
        - "!git status --porcelain  # worktree_status"
        - "!git fetch origin main --quiet; git rev-parse HEAD  # head"
        - "!git rev-parse origin/main  # origin_main"
        - "!just get-runs  # ci_runs"
      act: |
        Preflight gate — the release MUST NOT proceed unless the court is
        cutting it from a clean, green, pushed state:

        1. worktree_status must be empty — no uncommitted changes in the
           working tree.
        2. head must equal origin_main — everything intended for this
           release is committed AND pushed to origin.
        3. ci_runs must report no failed CI runs — red CI cannot be
           released from.

        If any check fails, report clearly and do not proceed.

        Use record_verdict to record pass/fail.
      then:
        - the verdicts are passed
      on_failure: retry

    - name: prepare-changelog
      minister: secretary
      given:
        - "!git log $(git describe --tags --abbrev=0 2>/dev/null || echo HEAD~20)..HEAD --oneline  # recent_commits"
      act: |
        Review the git log since the last tag (below) and compare against the
        Unreleased section of CHANGELOG.md. Ensure all user-notable changes are
        captured under Unreleased. Then rename the Unreleased section to the
        target version ({{ .version }}) with today's date, following the
        Keep a Changelog format.

        Use replace_text to edit CHANGELOG.md in place — do NOT rewrite the file.

        ## Recent Commits
        {{ .recent_commits }}
      on_failure: retry

    - name: bump-version
      minister: forge
      given:
        - "!grep 'var AsimiVersion' internal/utils/asimi_version.go  # current_version_line"
      act: |
        Update the AsimiVersion constant in internal/utils/asimi_version.go to
        "{{ .version }}". Use replace_text to change only the version value on
        the `var AsimiVersion =` line. Do not modify any other code in that file.

        Current line:
        {{ .current_version_line }}
      on_failure: retry

    - name: update-roadmap
      minister: forge
      act: |
        Review intent/docs/roadmap.md entries for {{ .version }}:
        1. For each planned item in this version's section, check whether it
           actually landed in this release (compare against the CHANGELOG
           entries you prepared). Mark landed items as done.
        2. Move any planned item that did NOT land into the next version's
           section.
        3. Keep items marked done under this version as the historical
           record of what shipped.

        Use replace_text for targeted edits — do NOT rewrite the file.
      on_failure: retry

    - name: verify-release-readiness
      minister: judge
      given:
        - the earth status
        - "!just test  # test_results"
        - "!just test-race ./...  # race_results"
        - "!just lint  # lint_results"
        - "!just build  # build_result"
        - "!just get-vuln  # vuln_results"
      act: |
        Verify that tests pass, linter is clean, and the project builds.
        Confirm the CHANGELOG version matches the version in asimi_version.go.
        Confirm the git tag for {{ .version }} does not already exist.
        If anything fails, report clearly and do not proceed.

        Release gate — race detector. The release MUST NOT proceed if
        `just test-race` reports any data race (a non-zero exit is a FAILED
        gate). Data races are invisible to the plain `just test`, which does
        not use -race, so this invocation is the load-bearing concurrency gate.

        Release gate — vulnerability scan. The release MUST NOT proceed if
        `just get-vuln` reports any reachable vulnerabilities. Note that
        `just test` does not run the scan at all (it runs `just test-race` when
        CI is set), so this explicit `just get-vuln` invocation is the
        load-bearing gate. Treat a non-zero govulncheck exit as a FAILED
        gate even if the test/build results above are clean.

        Use record_verdict to record pass/fail.
      then:
        - the verdicts are passed
        - record the judge's seal
      on_failure: goto
      on_failure_target: prepare-changelog

    - name: chancellor-reviews
      minister: chancellor
      given:
        - the earth status
        - the manifests
      act: |
        Review all release changes for correctness — CHANGELOG format, version
        consistency, roadmap accuracy, no unintended code changes.

        Call record_precedent ONCE with approved=true if the release artifacts
        are clean. Then return a one-sentence confirmation.
      then:
        - record the chancellor's seal
      on_failure: goto
      on_failure_target: prepare-changelog

    - name: commit-and-tag
      minister: secretary
      given:
        - the earth status
      act: |
        Stage CHANGELOG.md, internal/utils/asimi_version.go, intent/docs/roadmap.md,
        and any other modified release files. Commit with message
        "chore: releasing v{{ .version }}". Then create an annotated git tag:
        git tag -a v{{ .version }} -m "Release v{{ .version }}".
        Do NOT push — the Ruler must confirm the push as the final step.

    - name: confirm-push
      minister: secretary
      act: |
        Call ask_ruler asking the Ruler to confirm pushing the release
        tag and commit to origin. Options:
        - "Push release" (runs `git push origin main --tags`)
        - "Hold — review locally first" (stops here, Ruler pushes manually
          when ready)

    - name: verify-release
      minister: secretary
      act: |
        Post-release verification (only if the push was confirmed). Check
        each of the following and report the outcome of each:

        1. The tag v{{ .version }} is visible on origin
           (`git fetch origin --tags --quiet; git tag -l v{{ .version }}`).
        2. The GitHub Actions release workflow completed successfully for
           the v{{ .version }} tag — the release exists on
           https://github.com/afittestide/asimi/releases with binaries
           attached.
        3. The one-liner installer fetches the new version:
           `curl -fsSL https://asimi.dev/installer | bash` — verify
           `asimi --version` reports {{ .version }}.
        4. If brew is available, `brew upgrade asimi` serves the new
           version; otherwise note it as unverified.

        Report the results as a summary. A failed check does not roll back
        the release, but the Ruler must be informed via ask_ruler so a
        decision can be made.
      on_failure: retry
  then:
    - the release is tagged, (if confirmed) pushed, and verified
