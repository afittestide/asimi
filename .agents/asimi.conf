# Asimi Project Configuration File
# This project's config. Unlike the template in internal/config/default.conf,
# the tables below are live: they are this project's actual settings.
#
# Configuration files are loaded in the following order (later sources override earlier ones):
# 1. Built-in defaults
# 2. User config: ~/.config/asimi/asimi.conf
# 3. Project config: .agents/asimi.conf (this file)
# 4. Environment overrides: ASIMI_HOME, and for the LLM only ASIMI_MODEL,
#    ASIMI_PROVIDER and ASIMI_REASONING_EFFORT. There is no general ASIMI_*
#    override layer for the remaining options — set them here instead.
[sandbox]
passthrough_env = ["GOOGLE_CLOUD_PROJECT", "GOOGLE_CLOUD_REGION", "GOOGLE_APPLICATION_CREDENTIALS"]
[[sandbox.additional_mounts]]
source = "~/.config/gh"
destination = "/root/.config/gh"
# gcloud Application Default Credentials (user ADC) for Vertex AI / gcloud
# commands inside the sandbox. Read-write by ruling: gcloud maintains
# credentials.db / access_tokens.db here and refreshes tokens in place, so a
# read-only mount is not write-transparent. Trade-off accepted by the Ruler:
# a gcloud write inside the sandbox mutates the host's real credentials.
[[sandbox.additional_mounts]]
source = "~/.config/gcloud"
destination = "/root/.config/gcloud"
[run_shell_command]
run_on_host = ["^podman\\s.*"]
safe_run_on_host = ["^podman\\s+ps"]
# Timeout for shell commands in minutes
#timeout_minutes = 10
# Allow falling back to host execution if container execution fails
#allow_host_fallback = false
# Disable cleanup of temporary files and containers
#no_cleanup = false
[storage]
# Path to SQLite database for storing sessions and history
#database_path = "~/.local/share/asimi/asimi.sqlite"
[logging]
# Logging level: debug, info, warn, error
#level = "info"
# Logging format: text, json
#format = "text"
[ui]
# Enable markdown rendering in the terminal
#markdown_enabled = true
# Debounce time for Ctrl+C presses (duration string, e.g., "100ms")
#ctrl_c_debounce_time = "100ms"
# Window time for detecting double Ctrl+C presses (duration string, e.g., "500ms")
#ctrl_c_window_time = "500ms"
[llm]
# LLM provider: anthropic, openai, googleai, or custom
# provider = "openrouter"
# Model name to use (provider-specific)
# Examples:
#   Anthropic: claude-3-5-sonnet-20241022, claude-3-opus-20240229
#   OpenAI: gpt-4, gpt-3.5-turbo
#   Google: gemini-pro, gemini-1.5-pro
#model = ""
# API key for the LLM provider
# Note: It's recommended to use environment variables or keyring instead
# Environment variables: OPENAI_API_KEY, ANTHROPIC_API_KEY
#api_key = ""
# Base URL for API requests (for custom endpoints or proxies)
#base_url = ""
# Maximum thinking tokens for extended thinking models
#max_thinking_tokens = 0
# Maximum number of conversation turns before stopping
#max_turns = 0
# Reasoning effort level for the LLM (empty = provider default): "low", "medium", or "high"
#reasoning_effort = "medium"
# Disable context sanitization (advanced users only)
#disable_sanitization = false
# OAuth access token (managed by `asimi login`)
#auth_token = ""
# OAuth refresh token (managed by `asimi login`)
#refresh_token = ""
[history]
# Enable persistent session history
#enabled = true
# Maximum number of sessions to keep
#max_sessions = 50
# Maximum age of sessions in days (older sessions are deleted)
#max_age_days = 30
# Limit number of sessions shown in list (0 = no limit)
#list_limit = 0
# Automatically save sessions during conversation
#auto_save = false
# Auto-save interval in seconds
#save_interval = 300
[session]
# Enable session persistence
#enabled = true
# Maximum number of sessions to keep
#max_sessions = 50
# Maximum age of sessions in days
#max_age_days = 30
# Limit number of sessions shown in list (0 = no limit)
#list_limit = 0
# Automatically save sessions during conversation
#auto_save = true
# Auto-save interval in seconds
#save_interval = 300
# Project context file name (default: AGENTS.md, can be CLAUDE.md)
# This is auto-detected by :init if CLAUDE.md exists
#agents_file = "AGENTS.md"
