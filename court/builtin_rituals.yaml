# This file contains the builtin rituals (aka workflows) used by the Court
- name: swift-strike
  description: A tight loop for implementing edicts
  inputs:
    edict_id:
      type: string
      required: true
  max_retries: 3
  background:
    - the edict details
  steps:
    - name: forging
      minister: forge
      effort: low
      act: |
        {{- if .error }}
        Your previous work failed. Here is the error output:

        {{ .error }}

        Fix the issues and re-implement the edict correctly.
        {{- end }}

        Implement the changes for the edict:

        {{ .edict }}

        Focus on minimal, targeted changes to fulfill the intent.
      on_failure: retry
    - name: judging
      minister: judge
      given:
        - "!just test"
      act: |
        If any tests were changed, you need to verify that were not weakened
        and that non trivial changes are justified by the edict.

        If tests fail, provide clear feedback for the Forge on what needs to be fixed.
        If changes are not covered by test, add the missing tests and write them so they ensure the changed code will always work.
        When judgement is done, call record_verdict
      then:
        - the verdicts are passed
        - record the judge's seal
      on_failure: goto
      on_failure_target: forging
    - name: reviewing
      minister: chancellor
      act: |
        Review the code changes for the edict.
        Check for style violations, security concerns, and architectural issues.
        Record your insights using record_precedent.
        Produce a comprehensive code review report 
        Highlight any blocking issues and suggest improvements.

        ## Edict
        {{ .edict }}

      then:
        - the precedent is approved
        - record the chancellor's seal
      on_failure: goto
      on_failure_target: forging
  then:
    - the edict awaits ruler's seal

- name: castle-siege
  description: "A medium complexity 地 change with planning"
  inputs:
    edict_id:
      type: string
      required: true
  max_retries: 3
  background:
    - the edict details
  steps:
    - name: strategizing
      minister: war
      act: |
        Analyze the edict below and produce a technical Battle Plan.

        {{ .edict }}

        Break down the work into clear phases with dependencies.
        Use insert_ling to record the plan's lings.
      then:
        - the lings form a valid DAG
      on_failure: zhengming

    - name: implementing
      given:
        - the edict lings
      fork:
        over: lings
        batch_size: 1
      work:
        - name: forge-phase
          minister: forge
          act: |
            Implement this phase of the Battle Plan for edict {{ .edict_id }}:

            {{ .item.description }}

            Focus on minimal, targeted changes. Don't build or test the project.
          on_failure: retry
          then:
            - record the ling completed

    - name: judging
      minister: judge
      act: |
        Judge the changes made in the manifests.
        Make sure test coverage was not diminished
      then:
        - the verdicts are passed
        - record the judge's seal
      on_failure: goto
      on_failure_target: implementing

    - name: reviewing
      minister: chancellor
      given:
        - the earth status
      act: |
        Review the code changes in this ritual.
        Verify it adheres to the Imperial Code.
        Use record_precedent to record the ruling.

        ## Earth Status
        {{ .earth_borderlands }}
        {{ .earth_middle_kingdom }}
        {{ .earth_capital }}
      then:
        - the precedent is approved
        - record the chancellor's seal
      on_failure: goto
      on_failure_target: implementing
  then:
    - the edict awaits ruler's seal

- name: dawn-audience
  description: "Startup ritual - Secretary reports court status on Court boot, then requests zhengming"
  max_retries: 2
  # triggers:
  #  - event: court_started
  steps:
    - name: ping-model
      effort: low
      minister: judge
      act: |
        this is a smoke test. please reply with `pong`
    - name: check-sandbox
      then:
        - the sandbox is healthy
    - name: check-asimi-version
      given:
        - Asimi's versions
      out: |
        {{- if .asimi_version.has_update }}
        ⚠ Update available: {{ .asimi_version.latest_version }} (current {{ .asimi_version.current_version }}) — run :update
        {{- else }}
        Running latest Asimi version {{ .asimi_version.current_version }}
        {{- end }}
    - name: summarize
      on_failure: retry
      minister: war
      given:
        - the unsealed edicts
        - a heaven's snapshot
        - the earth status
        - the court status
      act: |
        Provide a succinct briefing on 三界 in 8 lines or fewer, based on
        the data below. Group by domain (heaven / earth / court). Highlight
        what most needs the Ruler's attention. No code blocks, no raw diffs.

        ## Unsealed Edicts
        {{ .unsealed_edicts }}
        ## Heaven's Snapshot
        {{ .heaven_snapshot }}
        ## Earth — Borderlands
        {{ .earth_borderlands }}
        ## Earth — Middle Kingdom
        {{ .earth_middle_kingdom }}
        ## Earth — Capital
        {{ .earth_capital }}
        ## Court Status
        {{ .court_status }}
    - name: next
      on_failure: retry
      minister: secretary
      effort: low
      act: |
        Court briefing:
        {{ .summarize }}

        Call ask_ruler with question "What's our next step?" and
        a few clear options. e.g, "review borderlands" or "clean-slate"
        
- name: review-borderlands
  description: |
    Code review - judge and chancellor review the borderlands before
    staging
  background:
    - the borderlands
  steps:
    - name: judging
      minister: judge
      given:
        - the borderlands
        - manifests for the borderlands
        - "!just test || true  # test_out"
      act: |
        If the tests pass, ensure
        the changes in the borderlands and middle kingdom are covered by tests.

        {{ .borderlands }}

        {{ .borderland_manifests }}

        Use record_verdict to record pass/fail for this edict.
        Reviewing is next so don't stage, commit nor push.
    - name: reviewing
      minister: chancellor
      given:
        - the borderlands
        - manifests for the borderlands
      act: |
        Review the code changes for the edict.
        Check for style violations, security concerns, and architectural issues.
        Record your insights using record_precedent.
        Produce a comprehensive code review report summarizing findings from both judge and chancellor.
        Highlight any blocking issues and suggest improvements.
        
        ## Edict
        {{ .edict }}

- name: clean-slate
  description: |
    Review all uncommitted changes (staged and unstaged), split them
    into logical commits, determine if any should amend HEAD, and
    link commits to edicts for the seal chain.
  background:
    - the earth status
    - the unsealed edicts
  steps:
    - name: survey
      minister: war
      given:
        - "!git log -1 --format='%H %s'  # head_commit"
      act: |
        Analyze the uncommitted changes below and produce a commit plan.

        ## Earth Status (all uncommitted work)
        {{ .earth_borderlands }}
        {{ .earth_middle_kingdom }}

        ## Current HEAD
        {{ .head_commit }}

        ## Unsealed Edicts
        {{ .unsealed_edicts }}

        Propose how to split the changes into logical commits. For each commit:
        - Which files belong together (by logical change, not just file type)
        - A concise commit message (start with "bug:", "feat:", or "chore:")
        - If the changes fulfill an unsealed edict, end the commit message
          with "e{edict_id}" (e.g. "e526") to link the commit to that edict

        Also determine: should any proposed commit amend HEAD instead of
        being a new commit? This is appropriate when the changes fix or
        refine the HEAD commit rather than introducing something new.

        Return the plan as a structured list. If there are no changes,
        say so and stop.
    - name: commit
      minister: secretary
      act: |
        Execute the commit plan from the survey step:

        {{ .survey }}

        1. For each proposed commit: `git add` the specified files,
           then `git commit -m "message"` (message must end with "e{id}" 
           if it fulfills an edict).
        2. If the plan calls for amending HEAD: `git add` those files
           first, then `git commit --amend --no-edit` to fold them in.

        If there are no changes to commit, report that and stop.

- name: fix-lint
  description: "Fix linter errors in parallel using fork/join"
  max_retries: 2
  background:
    # TODO:
    - the earth status
  steps:
    - name: lint
      minister: forge
      act: |
        Run the linter (just lint) and parse the output to extract a list of files with errors.
        Return a JSON array of objects with format: [{"file": "path/to/file.go", "errors": ["error1", "error2"]}]
    - name: fix-all-files
      fork:
        over: lint
        batch_size: 5
      work:
        - name: fix-file
          minister: forge
          act: |
            Fix all linter errors in file {{ .item.file }}.
            The errors to fix are: {{ .item.errors }}.
            Make minimal, targeted changes to resolve each error.
        - name: verify-file
          minister: judge
          given:
            - "!just lint {{ .item.file }}"
            # TODO
            # - run all tests covering {{ .item.file }}
          act: |
            Run all the tests covering file {{ .item.file }} 
          on_failure: retry
          on_failure_target: fix-file

    - name: commit-all
      minister: secretary
      given:
        - the earth status
      act: |
        Stage all changes and commit them together
        use git commit-tree for advanced blame exclusion.
  then:
    - the edict awaits the ruler's seal

- name: project-init
  description: "Initialize a project for Asimi - establishes infrastructure and validates through the seal chain"
  inputs:
    clearMode:
      type: boolean
      required: false
      default: false
    agentsFile:
      type: string
      required: false
      default: "AGENTS.md"
  max_retries: 5
  steps:
    - name: establish-infrastructure
      minister: forge
      given:
        - the project metadata
        - the infrastructure templates
      act: |
        Customize the infrastructure template files IN PLACE using replace_text to
        modify specific substrings. Do NOT use write_file on these templates — that
        rewrites from scratch and is the #1 cause of this ritual failing to converge.
        Always preserve the existing structure, headers, and any lines you are not
        explicitly told to touch.
        Handle the TODO comments in the template files and remove them when done

        Detect the primary language from the codebase (Gemfile→ruby, go.mod→go,
        requirements.txt/pyproject.toml→python, package.json→node, Cargo.toml→rust).

        Required edits:
        1. Justfile: Fill in the placeholder recipes (`install`, `lint`, `test`, `run`,
           `build`, `clean`, `bootstrap`) with the real commands for this project's
           language and tooling. PROJECT_NAME is already set — leave it alone. Do NOT
           touch the `build-sandbox` or `clean-sandbox` recipes. Be careful with
           indentation: just is whitespace-sensitive and recipe bodies must use a
           consistent leading indent (spaces, not mixed tabs).
        2. .agents/sandbox/Dockerfile: Set the `FROM` line to a sensible
           base image. Add any extra `RUN` steps needed to install
           system packages this project needs at build time. Do NOT remove the
           `COPY .agents/sandbox/asimi_runtime.sh` / `RUN ... bash.bashrc` block —
           removing it breaks sandbox command execution.
        3. .agents/sandbox/bashrc: Adjust for project needs. Export any env vars the
           project expects, set up PATH, and rewrite URLs that point to local host
           ports `XYZ` to `host.containers.internal:XYZ` so the sandbox can reach
           services running on the host.
        4. .agents/asimi.conf: `image_name` is already set correctly. Only edit if the
           sandbox requires a host env var (e.g. GITLAB_TOKEN) — in that case uncomment
           and set `passthrough_env` inside the existing `[sandbox]` section. Do NOT
           add a new `[sandbox]` section or a second `image_name` line — TOML rejects
           duplicates and the we will fail.
        5. {{.agentsFile}}: Append language and build conventions (how to run tests,
           lint, build, the project's coding style, anything a new contributor would
           need).

        Report which files were customized. If the only remaining task is to build the
        sandbox, finish and it will be built automatically.
        REMEMBER: You are running without a sandbox so minimize shell command as they
        require ruller approval.
      then:
        - build the sandbox
        - the sandbox is ready
      on_failure: retry

    - name: sandbox-ready
      minister: judge
      act: |
        Verify the sandbox is operational by running `uname -a`.
        The output should contain "Linux" (the sandbox runs on Linux, not the host macOS/Darwin).

        If the command runs and returns Linux, the sandbox is ready — record the Judge's Seal.
        If the command fails or returns a non-Linux kernel, the infrastructure is broken.
        Use record_verdict with clear feedback on what must be fixed.
      on_failure: goto
      on_failure_target: establish-infrastructure

    - name: chancellor-reviews
      minister: chancellor
      given:
        - the earth status
      act: |
        Review the infrastructure files for quality and convention adherence.

        Verify:
        - {{.agentsFile}} follows project conventions
        - Justfile commands are idiomatic
        - Dockerfile is secure and minimal
        - No hardcoded paths or secrets

        Call record_precedent ONCE with approved=true and a short reasoning to
        seal the review. Then return a one-sentence confirmation — that is the
        end of this step.

        Do NOT call suggest_edict, ask_ruler, approve_doc, or any other
        tool after record_precedent. Project-init is not the place to propose
        new edicts or conventions — the ritual only needs your seal to move on.
      on_failure: goto
      on_failure_target: establish-infrastructure
      then:
        - record the chancellor's seal
        - the infrastructure is staged
